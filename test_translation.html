<!DOCTYPE html>
<html>
<head>
    <title>Test Translation</title>
</head>
<body>
    <h1>Test Google Translation API</h1>
    <button onclick="testTranslation()">Test Translation</button>
    <div id="result"></div>

    <script>
        async function testTranslation() {
            try {
                const response = await fetch('http://localhost:8081/api/translate/batch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        texts: ['Hello World', 'Good service', 'Excellent work'],
                        target: 'ro'
                    })
                });
                
                const data = await response.json();
                document.getElementById('result').innerHTML = 
                    '<h3>Translation Results:</h3>' +
                    '<pre>' + JSON.stringify(data, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = 
                    '<h3>Error:</h3>' +
                    '<pre>' + error.message + '</pre>';
            }
        }
    </script>
</body>
</html>
