[build]
buildCommand = ""
startCommand = "sh -c 'cd server && STARTUP_DELAY=3000 node src/index.js'"
dockerfilePath = "Dockerfile.production"
nixpacksPlan.phases.setup.nixPkgs = ["nodejs_20"]

[deploy]
healthcheckPath = "/ping"
healthcheckTimeout = 60000
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[resources]
memoryLimit = 512
cpuLimit = 0.5