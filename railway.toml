[build]
builder = "DOCKERFILE"
dockerfilePath = "railway-hybrid-prod.Dockerfile"

[deploy]
startCommand = "cd server && npm start"
healthcheckPath = "/ping"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[environments]
  [environments.production]
    startCommand = "cd server && npm start"

# EMERGENCY HEALTHCHECK CONFIGURATION
# This configuration ensures Railway can properly healthcheck the service
# The h.js file provides a minimal /ping endpoint for healthchecks