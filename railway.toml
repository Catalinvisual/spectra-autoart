[build]
builder = "DOCKERFILE"
dockerfilePath = "railway-hybrid-prod.Dockerfile"

[deploy]
healthcheckPath = "/ping"
healthcheckTimeout = 600
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
# This configuration ensures Railway can properly healthcheck the service
# The h.js file provides a minimal /ping endpoint for healthchecks