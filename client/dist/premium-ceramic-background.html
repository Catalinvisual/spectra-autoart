<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Ceramic Coating Background</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .background-container {
            width: 1920px;
            height: 1080px;
            position: relative;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            overflow: hidden;
        }
        .ceramic-surface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 30% 20%, rgba(0, 229, 255, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(0, 153, 204, 0.2) 0%, transparent 50%),
                linear-gradient(45deg, transparent 0%, rgba(255, 255, 255, 0.05) 50%, transparent 100%);
        }
        .reflection-line {
            position: absolute;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            animation: sweep 8s ease-in-out infinite;
        }
        .reflection-line:nth-child(1) { top: 25%; width: 60%; left: 20%; animation-delay: 0s; }
        .reflection-line:nth-child(2) { top: 50%; width: 80%; left: 10%; animation-delay: 3s; }
        .reflection-line:nth-child(3) { top: 75%; width: 40%; left: 30%; animation-delay: 6s; }
        
        @keyframes sweep {
            0%, 100% { opacity: 0; transform: translateX(-100px); }
            50% { opacity: 1; transform: translateX(100px); }
        }
        
        .water-drop {
            position: absolute;
            width: 8px;
            height: 12px;
            background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.9) 0%, rgba(0, 229, 255, 0.6) 70%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: dropFall 4s linear infinite;
        }
        
        .water-drop:nth-child(4) { left: 15%; top: -20px; animation-delay: 0s; }
        .water-drop:nth-child(5) { left: 35%; top: -20px; animation-delay: 1s; }
        .water-drop:nth-child(6) { left: 55%; top: -20px; animation-delay: 2s; }
        .water-drop:nth-child(7) { left: 75%; top: -20px; animation-delay: 3s; }
        
        @keyframes dropFall {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            10% { opacity: 1; }
            90% { transform: translateY(1100px) scale(1); opacity: 1; }
            100% { transform: translateY(1100px) scale(0.8); opacity: 0; }
        }
        
        .text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            font-family: 'Arial', sans-serif;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
        }
        
        .main-text {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ffffff, #00e5ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .sub-text {
            font-size: 24px;
            opacity: 0.9;
            color: #00e5ff;
        }
        
        .download-btn {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(45deg, #00e5ff, #0099cc);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 25px;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .download-btn:hover {
            transform: translateX(-50%) translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 229, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="background-container" id="background">
        <div class="ceramic-surface"></div>
        <div class="reflection-line"></div>
        <div class="reflection-line"></div>
        <div class="reflection-line"></div>
        <div class="water-drop"></div>
        <div class="water-drop"></div>
        <div class="water-drop"></div>
        <div class="water-drop"></div>
        
        <div class="text-overlay">
            <div class="main-text">Premium Ceramic Coating</div>
            <div class="sub-text">Crystal Clear Protection</div>
        </div>
        
        <button class="download-btn" onclick="downloadBackground()">📸 Descarcă Background</button>
    </div>

    <script>
        function downloadBackground() {
            const background = document.getElementById('background');
            
            // Creează canvas pentru export high-quality
            const canvas = document.createElement('canvas');
            canvas.width = 1920;
            canvas.height = 1080;
            const ctx = canvas.getContext('2d');
            
            // Background gradient
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#0a0a0a');
            gradient.addColorStop(0.5, '#1a1a2e');
            gradient.addColorStop(1, '#16213e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Efecte de suprafață ceramică
            for (let i = 0; i < 20; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = Math.random() * 200 + 100;
                
                const radialGradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                radialGradient.addColorStop(0, `rgba(0, 229, 255, ${Math.random() * 0.3})`);
                radialGradient.addColorStop(1, 'transparent');
                
                ctx.fillStyle = radialGradient;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Linii de reflexie
            for (let i = 0; i < 8; i++) {
                const y = (canvas.height / 8) * i + Math.random() * 100;
                const lineGradient = ctx.createLinearGradient(0, y, canvas.width, y);
                lineGradient.addColorStop(0, 'transparent');
                lineGradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.6)');
                lineGradient.addColorStop(1, 'transparent');
                
                ctx.strokeStyle = lineGradient;
                ctx.lineWidth = Math.random() * 3 + 1;
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }
            
            // Text
            ctx.font = 'bold 64px Arial';
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(0, 229, 255, 0.8)';
            ctx.shadowBlur = 20;
            ctx.fillText('Premium Ceramic Coating', canvas.width / 2, canvas.height * 0.45);
            
            ctx.font = '32px Arial';
            ctx.fillStyle = '#00e5ff';
            ctx.fillText('Crystal Clear Protection', canvas.width / 2, canvas.height * 0.55);
            
            // Download
            canvas.toBlob(function(blob) {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'ceramic-coating-hero.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 'image/jpeg', 0.95);
        }
        
        // Adaugă efecte dinamice
        setInterval(() => {
            const drops = document.querySelectorAll('.water-drop');
            drops.forEach(drop => {
                if (Math.random() > 0.7) {
                    drop.style.left = (Math.random() * 80 + 10) + '%';
                    drop.style.animationDuration = (Math.random() * 3 + 2) + 's';
                }
            });
        }, 3000);
    </script>
</body>
</html>
