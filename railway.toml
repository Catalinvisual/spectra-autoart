[build]
buildCommand = ""
startCommand = "sh -c 'cd server && node src/index.js'"
dockerfilePath = "Dockerfile.production"
nixpacksPlan.phases.setup.nixPkgs = ["nodejs_20"]

[deploy]
healthcheckPath = "/ping"
healthcheckTimeout = 10000
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[resources]
memoryLimit = 512
cpuLimit = 0.5